services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bda
      POSTGRES_USER: bda
      POSTGRES_PASSWORD: bda_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bda -d bda"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - bda_db:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8100"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/bda}
    environment:
      BDA_APP_URL: ${BDA_APP_URL:-http://localhost:3000}
      BDA_API_INTERNAL_URL: ${BDA_API_INTERNAL_URL:-http://backend:8100}
      BDA_ITHUTE_AUTH_URL: ${BDA_ITHUTE_AUTH_URL:-https://auth.ithute.co.ls}
      BDA_OIDC_CLIENT_ID: ${BDA_OIDC_CLIENT_ID:-business-digital-address}
      BDA_RUNTIME_ENVIRONMENT: ${BDA_RUNTIME_ENVIRONMENT:-development}
      BDA_DEV_AUTH_BYPASS: ${BDA_DEV_AUTH_BYPASS:-true}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  bda_db:
