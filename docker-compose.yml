services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bda
      POSTGRES_USER: bda
      POSTGRES_PASSWORD: bda_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bda -d bda"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - bda_db:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8100"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-https://auth.ithute.co.ls}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  bda_db:
