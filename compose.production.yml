name: business-digital-address

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BDA_DB_NAME:?BDA_DB_NAME is required}
      POSTGRES_USER: ${BDA_DB_USER:?BDA_DB_USER is required}
      POSTGRES_PASSWORD: ${BDA_DB_PASSWORD:?BDA_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  migrate:
    image: ${BDA_BACKEND_IMAGE:-business-digital-address-backend}:${BDA_IMAGE_TAG:?BDA_IMAGE_TAG is required}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      BDA_DATABASE_URL: ${BDA_DATABASE_URL:?BDA_DATABASE_URL is required}
      BDA_ENVIRONMENT: production
      BDA_OFFICIAL_DOMAIN: business.ls
      BDA_CORS_ORIGINS: https://business.ls
      BDA_AUTH_ISSUER: https://auth.ithute.co.ls
      BDA_AUTH_JWKS_URL: https://auth.ithute.co.ls/.well-known/jwks.json
      BDA_AUTH_AUDIENCE: business-digital-address
      BDA_AUTH_REQUIRED: "true"
      BDA_ITHUTE_TOKEN_URL: https://auth.ithute.co.ls/v1/auth/service-token
      BDA_ITHUTE_SERVICE_CLIENT_ID: business-digital-address
      BDA_ITHUTE_SERVICE_CLIENT_SECRET: ${BDA_ITHUTE_SERVICE_CLIENT_SECRET:-}
      BDA_ITHUTE_INVITE_URL: https://auth.ithute.co.ls/v1/platform/identity-invitations
      BDA_ITHUTE_MAIL_BASE_URL: https://api.ithute.co.ls/api/v1/platform/mail
      BDA_ENABLE_REAL_MAIL_PROVISIONING: ${BDA_ENABLE_REAL_MAIL_PROVISIONING:-false}
      BDA_EXTERNAL_EMAIL_VERIFICATION_TTL_MINUTES: ${BDA_EXTERNAL_EMAIL_VERIFICATION_TTL_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - app

  backend:
    image: ${BDA_BACKEND_IMAGE:-business-digital-address-backend}:${BDA_IMAGE_TAG:?BDA_IMAGE_TAG is required}
    restart: unless-stopped
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8100"]
    environment: *backend_environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/ready', timeout=2).read()"
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks:
      - database
      - app

  frontend:
    image: ${BDA_FRONTEND_IMAGE:-business-digital-address-frontend}:${BDA_IMAGE_TAG:?BDA_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      BDA_APP_URL: https://business.ls
      BDA_API_INTERNAL_URL: http://backend:8100
      BDA_ITHUTE_AUTH_URL: https://auth.ithute.co.ls
      BDA_OIDC_CLIENT_ID: business-digital-address
      BDA_RUNTIME_ENVIRONMENT: production
      BDA_DEV_AUTH_BYPASS: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks:
      app: {}
      public-edge:
        aliases:
          - business-digital-address-web

volumes:
  postgres_data:
    name: business-digital-address-postgres

networks:
  app:
    internal: true
  database:
    internal: true
  public-edge:
    external: true
