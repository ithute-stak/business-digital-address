name: Business Digital Address CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bda
          POSTGRES_USER: bda
          POSTGRES_PASSWORD: bda_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bda -d bda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BDA_DATABASE_URL: postgresql+psycopg://bda:bda_ci_password@127.0.0.1:5432/bda
      BDA_ENVIRONMENT: development
      BDA_OFFICIAL_DOMAIN: business.ls
      BDA_AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app alembic tests
      - name: Migrate PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend contracts
        working-directory: backend
        run: python -m pytest -q
      - name: Build backend image
        run: docker build -t business-digital-address-api:ci backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Verify OIDC/BFF security contract
        working-directory: frontend
        run: npm run auth-contract
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api/bda
          BDA_APP_URL: https://business.ls
          BDA_API_INTERNAL_URL: http://backend:8100
          BDA_ITHUTE_AUTH_URL: https://auth.ithute.co.ls
          BDA_OIDC_CLIENT_ID: business-digital-address
          BDA_RUNTIME_ENVIRONMENT: production
          BDA_DEV_AUTH_BYPASS: "false"
        run: npm run build
      - name: Build frontend image
        run: docker build -t business-digital-address-web:ci frontend

  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Render local Compose topology
        run: |
          cp .env.example .env
          docker compose config >/tmp/business-digital-address-compose.yml
          grep -q "backend:" /tmp/business-digital-address-compose.yml
          grep -q "frontend:" /tmp/business-digital-address-compose.yml
          grep -q "db:" /tmp/business-digital-address-compose.yml
          grep -q "BDA_DEV_AUTH_BYPASS: \"true\"" /tmp/business-digital-address-compose.yml
          grep -q "BDA_API_INTERNAL_URL: http://backend:8100" /tmp/business-digital-address-compose.yml

  production-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Render locked production topology
        env:
          BDA_BACKEND_IMAGE: business-digital-address-backend
          BDA_FRONTEND_IMAGE: business-digital-address-frontend
          BDA_IMAGE_TAG: ci-production-topology
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f compose.production.yml config >/tmp/bda-production.yml
          grep -Fq 'BDA_AUTH_REQUIRED: "true"' /tmp/bda-production.yml
          grep -Fq 'BDA_DEV_AUTH_BYPASS: "false"' /tmp/bda-production.yml
          grep -Fq 'business-digital-address-web' /tmp/bda-production.yml
          grep -Fq 'public-edge' /tmp/bda-production.yml
          grep -Fq 'egress:' /tmp/bda-production.yml
          grep -Fq 'internal: true' /tmp/bda-production.yml
          if grep -Eq '^[[:space:]]+ports:' /tmp/bda-production.yml; then
            echo 'Production topology must not publish application/database ports directly.' >&2
            exit 1
          fi
