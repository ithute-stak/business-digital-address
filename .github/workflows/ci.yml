name: Business Digital Address CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bda
          POSTGRES_USER: bda
          POSTGRES_PASSWORD: bda_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bda -d bda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BDA_DATABASE_URL: postgresql+psycopg://bda:bda_ci_password@127.0.0.1:5432/bda
      BDA_ENVIRONMENT: development
      BDA_OFFICIAL_DOMAIN: business.ls
      BDA_AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app alembic tests
      - name: Migrate PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend contracts
        working-directory: backend
        run: python -m pytest -q
      - name: Build backend image
        run: docker build -t business-digital-address-api:ci backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8100
          NEXT_PUBLIC_AUTH_URL: https://auth.ithute.co.ls
        run: npm run build
      - name: Build frontend image
        run: docker build -t business-digital-address-web:ci frontend

  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Render local Compose topology
        run: |
          cp .env.example .env
          docker compose config >/tmp/business-digital-address-compose.yml
          grep -q "backend:" /tmp/business-digital-address-compose.yml
          grep -q "frontend:" /tmp/business-digital-address-compose.yml
          grep -q "db:" /tmp/business-digital-address-compose.yml
